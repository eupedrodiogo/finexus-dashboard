<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/pwa-512x512.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="google" content="notranslate" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/pwa-512x512.png" />
  <title>Finexus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <script>
    window.onerror = function(msg, url, line, col, error) {
      var errorMsg = "Erro JS: " + msg + "\nEm: " + url + "\nLinha: " + line;
      alert(errorMsg);
      console.error(errorMsg);
      return false;
    };
    window.onunhandledrejection = function(event) {
      var errorMsg = "Erro de Promessa: " + (event.reason ? (event.reason.message || event.reason) : "Desconhecido");
      alert(errorMsg);
      console.error(errorMsg);
    };
    // Timer de segurança para diagnosticar "travamento" no Carregando
    setTimeout(function() {
      var root = document.getElementById('root');
      if (root && root.innerHTML.indexOf('Carregando') !== -1) {
        // Adiciona um botão de reset se falhar por muito tempo
        var debugDiv = document.createElement('div');
        debugDiv.style.cssText = "position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); text-align: center; z-index: 9999;";
        debugDiv.innerHTML = `
          <p style="color: #ef4444; font-size: 14px; margin-bottom: 10px; font-weight: bold;">
            O app está demorando para iniciar.
          </p>
          <button onclick="localStorage.clear(); window.location.reload();" 
                  style="background: #475569; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold;">
            Resetar App e Recarregar
          </button>
        `;
        document.body.appendChild(debugDiv);
        
        alert("O React parece ter falhado ao montar. Verifique se há erros de importação ou sintaxe. Tentando recuperar...");
      }
    }, 20000);
  </script>
</head>

<body
  class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 transition-colors duration-300 antialiased selection:bg-indigo-500 selection:text-white overflow-x-hidden overflow-y-auto">
  <div id="root">
    <div style="display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; color: #64748b;">
      Carregando Finexus...
    </div>
  </div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
